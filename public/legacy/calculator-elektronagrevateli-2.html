<!doctype html>
<html>
  <head>
    <script>
      function clampNum(v, min, max) {
        if (!Number.isFinite(v)) return NaN;
        return Math.min(Math.max(v, min), max);
      }

      function setOutOfRangeClass(isOutOfRange, el) {
        isOutOfRange
          ? el.classList.add("out-of-range")
          : el.classList.remove("out-of-range");
      }

      function calculatorElektronagrevateliTwo(form) {
        const k = clampNum(Number(form.k.value), 1000, 100000) || 0;
        const l = clampNum(Number(form.l.value), -50, 65) || 0;
        const m = clampNum(Number(form.m.value), 2.5, 247.5) || 0;
        const r = m / (((k * (353 / (273.15 + l))) / 3600000) * 1009) + l;
        console.log(k, l, m, r);
        const outEl = form.total;
        const deltaEl = form.deltaT;
        // write value
        outEl.value = r.toFixed(0);

        // 🔥 дельта нагрева
        const deltaT = r - l;

        // ⚡ ток
        const current = (m * 1000) / 658.16;

        deltaEl.value = deltaT.toFixed(1);
        form.current.value = current.toFixed(1);

        setOutOfRangeClass(r > 100, outEl);
        setOutOfRangeClass(deltaT > 150, deltaEl);
        // check optional data-min / data-max on the output and toggle warning class
        /* const min = Number(outEl.dataset.min ?? NaN);
        const max = Number(outEl.dataset.max ?? NaN);
        if (Number.isFinite(min) && Number.isFinite(max)) {
          if (r < min || r > max) outEl.classList.add("out-of-range");
          else outEl.classList.remove("out-of-range");
        } else {
          // no range specified: ensure class removed
          outEl.classList.remove("out-of-range");
        } */
      }

      function init() {
        const form = document.querySelector(
          "form.calculator.elektronagrevateli-2",
        );
        if (!form) return;
        const inputs = form.querySelectorAll('input[type="text"]');

        function toggleHasValue(el) {
          if (el.value && el.value.trim() !== "") el.classList.add("has-value");
          else el.classList.remove("has-value");
        }

        inputs.forEach((input) => {
          // initial state
          toggleHasValue(input);
          // keep only digits and one decimal point while typing
          input.addEventListener("input", () => {
            const before = input.value;
            // allow only 0-9 and dot
            let v = before.replace(/[^-0-9.]/g, "");
            // keep only first dot
            const firstDot = v.indexOf(".");
            if (firstDot !== -1) {
              v =
                v.slice(0, firstDot + 1) +
                v.slice(firstDot + 1).replace(/\./g, "");
            }
            if (v !== before) input.value = v;
            toggleHasValue(input);
          });

          // clamp to data-min/data-max on blur (and ensure one decimal)
          input.addEventListener("blur", () => {
            // keep empty fields empty (don't coerce "" -> 0)
            if (!input.value || input.value.trim() === "") {
              input.value = "";
              toggleHasValue(input);
              return;
            }

            const min = Number(input.dataset.min ?? NaN);
            const max = Number(input.dataset.max ?? NaN);
            const n = Number(input.value);
            if (!Number.isFinite(n)) {
              // clear invalid entry
              input.value = "";
              toggleHasValue(input);
              return;
            }
            if (Number.isFinite(min) && Number.isFinite(max)) {
              const clamped = clampNum(n, min, max);
              // format with at most one decimal place (matches calculator output)
              input.value = (Math.round(clamped * 10) / 10).toString();
            }
            toggleHasValue(input);
          });
        });

        // clear highlights on form reset
        const resetBtn = form.querySelector('input[type="reset"]');
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            inputs.forEach((i) => i.classList.remove("has-value"));
            // also clear out-of-range highlight on the output
            form
              .querySelectorAll("input")
              .forEach((el) => el.classList.remove("out-of-range"));
            // const out = form.querySelector('input[name="total"]');
            // if (out) out.classList.remove("out-of-range");
          });
        }
      }

      init();
    </script>
  </head>

  <body>
    <!-- Калькулятор (начало) -->
    <form class="calculator elektronagrevateli-2">
      <label>
        Объем нагреваемого воздуха, м<sup>3</sup>/ч
        <input type="text" name="k" data-min="1000" data-max="100000" />
      </label>

      <label>
        Температура воздуха на входе, °С
        <input type="text" name="l" data-min="-50" data-max="65" />
      </label>

      <label>
        Мощность электрокалорифера, кВт
        <input type="text" name="m" data-min="2.5" data-max="247.5" />
      </label>

      <div class="calculator-buttons">
        <input
          type="button"
          value="Рассчитать"
          onclick="calculatorElektronagrevateliTwo(this.form)"
        />
        <input type="reset" value="Сброс" />
      </div>

      <label>
        Температура воздуха на выходе, °С
        <input
          type="text"
          name="total"
          data-max="100"
          disabled
          class="bg-transparent"
        />
      </label>
      <label>
        <span class="text-black/70">Дельта нагрева, °С</span>
        <input
          type="text"
          name="deltaT"
          data-max="150"
          disabled
          class="bg-transparent"
        />
      </label>
      <label>
        <span class="text-black/70"
          >Токовая нагрузка в трехфазных сетях, А</span
        >
        <input type="text" name="current" disabled class="bg-transparent" />
      </label>
    </form>
    <!-- Калькулятор (конец) -->
  </body>
</html>
